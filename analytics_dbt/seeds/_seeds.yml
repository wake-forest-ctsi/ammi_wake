seeds:
  - name: daterange
    config:
      delimiter: "|"
  - name: zip_tract
    config:
      delimiter: "|"
      column_types:
        zip: varchar(5)
        tractfips: varchar(11)
  - name: useful_dx_depression
    config:
      delimiter: ","
      column_types:
        feature: varchar(10)
        shap_edinburgh: float
        shap_phq9: float
        shap_F53: float
  - name: useful_rx_depression
    config:
      delimiter: ","
      column_types:
        feature: varchar(10)
        shap_edinburgh: float
        shap_phq9: float
        shap_F53: float
  - name: rxnorm_product_identity
    config:
      column_types:
        raw_rxcui: varchar(100)
        rxcui: varchar(100)
        ingredient_cui_combined: varchar(200)